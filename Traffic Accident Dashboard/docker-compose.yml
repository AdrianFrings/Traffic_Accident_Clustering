services:
  dashboard:
    build: .
    image: traffic-accident-dashboard
    container_name: traffic-accident-dashboard
    ports:
      - "8000:8000"
    volumes:
      # Provides clusters.parquet + points/ partitions to the runtime.
      # Generate them first with:
      #   python src/processor.py          (full pipeline; needs raw year CSVs)
      #   python src/partition_points.py   (per-city point partitions)
      #   python src/enrich_street_names.py (bake street names; resumable)
      - ./data:/app/data:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
